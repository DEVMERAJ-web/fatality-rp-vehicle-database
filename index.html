<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fatality Roleplay 2.0 Vehicle Database">
  <title>Fatality Roleplay 2.0 - Vehicle Database</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .subscribe-gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);padding:20px}.subscribe-box{width:min(440px,100%);background:#16181C;border:1px solid #00C2FF;border-radius:12px;padding:30px;text-align:center;box-shadow:0 0 35px rgba(0,194,255,.25)}.subscribe-box h2{margin:0 0 10px;color:#fff}.subscribe-box p{margin:0 0 22px;color:#94A3B8;line-height:1.6}.subscribe-btn{width:100%;border:0;border-radius:7px;padding:13px 18px;background:#00C2FF;color:#000;font-weight:800;cursor:pointer;transition:.2s}.subscribe-btn:hover{box-shadow:0 0 18px rgba(0,194,255,.45);transform:translateY(-1px)}.made-by{position:fixed;right:14px;bottom:10px;z-index:9998;font-size:11px;letter-spacing:1px;color:#00C2FF;opacity:.65;pointer-events:none}
  </style>
</head>
<body>
  <div id="subscribe-gate" class="subscribe-gate">
    <div class="subscribe-box">
      <h2>Subscribe to Meraj</h2>
      <p>Subscribe to Meraj's YouTube channel to continue to the Fatality Roleplay 2.0 Vehicle Database.</p>
      <button id="subscribe-btn" class="subscribe-btn">▶ Subscribe &amp; Continue</button>
    </div>
  </div>

  <header class="navbar">
    <div class="nav-container">
      <div class="brand-logo">
        <span class="brand-title">FATALITY <span class="accent-text">2.0</span></span>
        <span class="brand-subtitle">VEHICLE DATABASE</span>
      </div>
      <div class="watermark-badge">MADE BY MERAJ</div>
    </div>
  </header>

  <main class="main-layout">
    <aside class="filter-panel" aria-label="Vehicle Filters">
      <div class="filter-header">
        <h2>Filters</h2>
        <button id="reset-filters-btn" class="btn-secondary" title="Reset all active filters">Reset All</button>
      </div>
      <div class="filter-group">
        <label for="search-input">Search Database</label>
        <input type="text" id="search-input" placeholder="Search by code, name, brand, etc..." autocomplete="off">
      </div>
      <div class="filter-group">
        <label for="access-filter">Access Level</label>
        <select id="access-filter"><option value="ALL">ALL</option><option value="CIVILIAN">CIVILIAN</option><option value="EMS">EMS</option><option value="POLICE">POLICE</option><option value="GOVERNMENT">GOVERNMENT</option><option value="ADMIN">ADMIN</option></select>
      </div>
      <div class="filter-group">
        <label for="type-filter">Vehicle Type</label>
        <select id="type-filter"><option value="ALL">All Types</option><option value="Car">🚗 Car</option><option value="Motorcycle">🏍️ Motorcycle</option><option value="Boat">🛥️ Boat</option><option value="Helicopter">🚁 Helicopter</option><option value="Plane">✈️ Plane</option><option value="Utility">🚚 Utility</option></select>
      </div>
      <div class="filter-group"><label for="subtype-filter">Subtype</label><select id="subtype-filter"><option value="ALL">All Subtypes</option></select></div>
      <div class="filter-group"><label for="category-filter">Category</label><select id="category-filter"><option value="ALL">All Categories</option></select></div>
      <div class="filter-group"><label for="department-filter">Department</label><select id="department-filter"><option value="ALL">All Departments</option></select></div>
      <div class="filter-group"><label for="status-filter">Status</label><select id="status-filter"><option value="ALL">All Statuses</option></select></div>
      <div class="filter-group checkbox-group"><label for="favorites-toggle" class="checkbox-label"><input type="checkbox" id="favorites-toggle"> Show Favorites Only</label></div>
    </aside>

    <section class="content-area">
      <div class="metrics-bar"><span id="results-count">Loading Fatality database...</span></div>
      <div id="vehicle-grid" class="vehicle-grid" aria-live="polite"></div>
    </section>
  </main>

  <div id="vehicle-modal" class="modal-overlay" aria-hidden="true" role="dialog" aria-labelledby="modal-title">
    <div class="modal-card"><button id="modal-close" class="modal-close-btn" aria-label="Close Modal">&times;</button><div id="modal-body"></div></div>
  </div>

  <footer class="footer"><p>Fatality Roleplay 2.0 &copy; Vehicle Database | <span class="accent-text">MADE BY MERAJ</span></p></footer>
  <div class="made-by">MADE BY MERAJ</div>

  <script src="./js/app.js"></script>
  <script src="./js/online-images.js"></script>
  <script src="./js/image-overrides-expanded.js"></script>
  <script>
    document.getElementById('subscribe-btn').addEventListener('click',function(){window.open('https://www.youtube.com/@op_meraj_ff?sub_confirmation=1','_blank','noopener,noreferrer');document.getElementById('subscribe-gate').style.display='none';});
  </script>
</body>
</html>
