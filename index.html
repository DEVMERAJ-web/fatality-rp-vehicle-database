<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fatality Roleplay 2.0 - Vehicle Database</title>
  <link rel="stylesheet" href="css/css%20style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <div class="brand-logo">
        <span class="brand-title">FATALITY <span class="accent-text">2.0</span></span>
        <span class="brand-subtitle">VEHICLE DATABASE</span>
      </div>
      <div class="watermark-badge">MADE BY MERAJ</div>
    </div>
  </header>

  <main class="main-layout">
    <aside class="filter-panel" aria-label="Vehicle Filters">
      <div class="filter-header">
        <h2>Filters</h2>
        <button id="reset-filters-btn" class="btn-secondary" title="Reset all active filters">Reset All</button>
      </div>
      <div class="filter-group">
        <label for="search-input">Search Database</label>
        <input type="text" id="search-input" placeholder="Search by code, name, brand, etc..." autocomplete="off">
      </div>
      <div class="filter-group">
        <label for="access-filter">Access Level</label>
        <select id="access-filter">
          <option value="ALL">ALL</option><option value="CIVILIAN">CIVILIAN</option><option value="EMS">EMS</option><option value="POLICE">POLICE</option><option value="GOVERNMENT">GOVERNMENT</option><option value="ADMIN">ADMIN</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="type-filter">Vehicle Type</label>
        <select id="type-filter">
          <option value="ALL">All Types</option><option value="Car">Car</option><option value="Motorcycle">Motorcycle</option><option value="Boat">Boat</option><option value="Helicopter">Helicopter</option><option value="Plane">Plane</option><option value="Utility">Utility</option>
        </select>
      </div>
      <div class="filter-group"><label for="subtype-filter">Subtype</label><select id="subtype-filter"><option value="ALL">All Subtypes</option></select></div>
      <div class="filter-group"><label for="department-filter">Department</label><select id="department-filter"><option value="ALL">All Departments</option></select></div>
      <div class="filter-group"><label for="status-filter">Status</label><select id="status-filter"><option value="ALL">All Statuses</option></select></div>
      <div class="filter-group checkbox-group">
        <label for="favorites-toggle" class="checkbox-label"><input type="checkbox" id="favorites-toggle"> Show Favorites Only</label>
      </div>
    </aside>

    <section class="content-area">
      <div class="metrics-bar"><span id="results-count">Showing 0 vehicles</span></div>
      <div id="vehicle-grid" class="vehicle-grid" aria-live="polite"></div>
    </section>
  </main>

  <div id="vehicle-modal" class="modal-overlay" aria-hidden="true" role="dialog" aria-labelledby="modal-title">
    <div class="modal-card">
      <button id="modal-close" class="modal-close-btn" aria-label="Close Modal">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer class="footer"><p>Fatality Roleplay 2.0 &copy; Vehicle Database | <span class="accent-text">MADE BY MERAJ</span></p></footer>

  <script src="js/js%20app.js"></script>
</body>
</html>
